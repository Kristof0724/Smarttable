<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartTable - Bejelentkezés</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />

</head>
<body>
  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <a class="btn btn-link px-0 mb-3" href="index.html"><i class="bi bi-arrow-left me-1"></i>Vissza a kezdőlapra</a>

          <div class="card st-card">
            <div class="card-body p-4 p-lg-5">
              <h1 class="h4 fw-bold mb-3">Bejelentkezés</h1>

              <div id="err" class="error mb-3"></div>

              <label class="form-label">E-mail</label>
              <input id="email" class="form-control mb-3" type="email" value="user@example.com" />

              <label class="form-label">Jelszó</label>
              <input id="password" class="form-control mb-4" type="password" value="user123" />

              <div class="d-grid gap-2">
                <button id="loginBtn" class="btn btn-primary btn-lg">
                  <i class="bi bi-box-arrow-in-right me-1"></i>Belépés
                </button>
                <a class="btn btn-outline-secondary" href="register.html">Nincs fiókod? Regisztrálj</a>
              </div>
            </div>
          </div>

          <div class="hint mt-3">
            Admin teszt: <span class="text-secondary">admin@example.com / admin123</span>
          </div>
        </div>
      </div>
    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/login.js"></script>
</body>
</html>
