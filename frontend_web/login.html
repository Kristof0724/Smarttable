<!DOCTYPE html>
<html lang="hu">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>SmartTable – Belépés</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
			<div class="container">
				<a class="navbar-brand fw-bold" href="index.html">SmartTable</a>
			</div>
		</nav>

		<main class="container py-5" style="max-width: 520px">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<h1 class="h4 mb-3">Belépés</h1>

					<div class="mb-3">
						<label class="form-label">Email</label>
						<input id="email" type="email" class="form-control" />
					</div>

					<div class="mb-3">
						<label class="form-label">Jelszó</label>
						<input id="password" type="password" class="form-control" />
					</div>

					<button id="login" class="btn btn-primary w-100">Belépés</button>

					<div id="err" class="text-danger small mt-3"></div>

					<div class="text-center mt-3">
						<a href="register.html">Nincs fiókod? Regisztráció</a>
					</div>
				</div>
			</div>
		</main>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script type="module" src="js/login.js"></script>
	</body>
</html>
