<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartTable - Foglalás</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container py-2">
    <a class="navbar-brand fw-bold" href="index.html">SmartTable</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html" >Kezdőlap</a></li>
        <li class="nav-item"><a class="nav-link active" href="restaurants.html" id="navRestaurants">Éttermek</a></li>
        <li class="nav-item"><a class="nav-link" href="my_reservations.html" id="myResBtn">Foglalásaim</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html" id="adminBtn" style="display:none;">Admin</a></li>
      </ul>

      <div class="d-flex gap-2">
        <button id="logoutBtn" class="btn btn-outline-secondary">
          <i class="bi bi-box-arrow-right me-1"></i>Kijelentkezés
        </button>
      </div>
    </div>
  </div>
</nav>


<main class="py-4">
  <div class="container">
    <a class="btn btn-link px-0 mb-3" id="backLink" href="restaurants.html"><i class="bi bi-arrow-left me-1"></i>Vissza</a>

    <div class="card st-card">
      <div class="card-body p-4 p-lg-5">
        <h1 class="h4 fw-bold mb-3">Asztalfoglalás</h1>

        <div id="err" class="error mb-3"></div>
        <div id="ok" class="ok mb-3"></div>

        <div id="openHint" class="hint mb-3"></div>

        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Dátum</label>
            <input id="date" class="form-control" type="date" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Időpont</label>
            <input id="time" class="form-control" type="time" list="reserveTimeSlots" />
            <datalist id="reserveTimeSlots"></datalist>
          </div>
          <div class="col-md-4">
            <label class="form-label">Létszám</label>
            <input id="peopleCount" class="form-control" type="number" min="1" max="20" value="2" />
          </div>
        </div>

        <div class="d-grid d-md-flex gap-2 mt-4">
          <button id="reserveBtn" class="btn btn-primary btn-lg">
            <i class="bi bi-check2-circle me-1"></i>Foglalás véglegesítése
          </button>
          <a class="btn btn-outline-secondary btn-lg" href="my_reservations.html">
            Foglalásaim
          </a>
        </div>

        <div class="hint mt-3">
          A sikeres foglalás után a „Foglalásaim” oldalra irányítunk.
        </div>
      </div>
    </div>
  </div>
</main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/reservations.js"></script>
</body>
</html>
