<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartTable - Foglalásaim</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container py-2">
    <a class="navbar-brand fw-bold" href="index.html">SmartTable</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html" >Kezdőlap</a></li>
        <li class="nav-item"><a class="nav-link" href="restaurants.html" id="navRestaurants">Éttermek</a></li>
        <li class="nav-item"><a class="nav-link active" href="my_reservations.html" id="myResBtn">Foglalásaim</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html" id="adminBtn" style="display:none;">Admin</a></li>
      </ul>

      <div class="d-flex gap-2">
        <button id="logoutBtn" class="btn btn-outline-secondary">
          <i class="bi bi-box-arrow-right me-1"></i>Kijelentkezés
        </button>
      </div>
    </div>
  </div>
</nav>


<main class="py-4">
  <div class="container">
    <div class="d-flex align-items-end justify-content-between mb-3">
      <div>
        <h1 class="h3 fw-bold mb-1">Foglalásaim</h1>
        <div class="text-secondary">Itt látod a saját foglalásaidat.</div>
      </div>
      <a class="btn btn-outline-secondary" href="restaurants.html"><i class="bi bi-shop me-1"></i>Éttermek</a>
    </div>

    <div id="err" class="error mb-3"></div>
    <div id="loading" class="hint mb-3">Betöltés...</div>

    <div id="list" class="row g-3"></div>
  </div>
</main>


<div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1080;"></div>

<!-- Lemondás megerősítő modal -->
<div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Foglalás lemondása</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bezárás"></button>
      </div>
      <div class="modal-body">
        Biztosan le szeretnéd mondani ezt a foglalást?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Mégse</button>
        <button type="button" class="btn btn-danger" id="confirmCancelBtn">
          <i class="bi bi-x-circle me-1"></i>Lemondás
        </button>
      </div>
    </div>
  </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/my_reservations.js"></script>
</body>
</html>
